global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: bullmq
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
